{% extends "base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<h1>Регистрация</h1>

{% if errors %}
<ul class="errors">
    {% for e in errors %}<li>{{ e }}</li>{% endfor %}
</ul>
{% endif %}

<form method="post" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label>Име
        <input type="text" name="name" value="{{ form.get('name', '') }}" maxlength="100" required>
    </label>
    <label>Имейл
        <input type="email" name="email" value="{{ form.get('email', '') }}" maxlength="255" required>
    </label>
    <label>Телефон (по желание)
        <input type="tel" name="phone" value="{{ form.get('phone', '') }}" maxlength="30">
    </label>
    <label>Парола (поне 8 символа)
        <input type="password" name="password" minlength="8" maxlength="128" required>
    </label>

    <button type="submit">Регистрирай се</button>
</form>

<p>Вече имаш акаунт? <a href="{{ url_for('login') }}">Вход</a></p>
{% endblock %}
