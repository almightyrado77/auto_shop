<!doctype html>
<html lang="bg">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Автомагазин{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
    <a href="/">Автомагазин</a>
    <nav class="header-nav">
        {% if session.get('user_id') %}
            <span>{{ session.get('user_name') }}</span>
            <form method="post" action="{{ url_for('logout') }}" class="inline">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="link-button">Изход</button>
            </form>
        {% else %}
            <a href="{{ url_for('login') }}">Вход</a>
            <a href="{{ url_for('register') }}">Регистрация</a>
        {% endif %}
        <a href="{{ url_for('cart_page') }}">Количка ({{ cart_count }})</a>
    </nav>
</header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
